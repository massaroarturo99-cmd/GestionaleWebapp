{% extends "base.html" %}

{% block header_title %}Agenda Officina{% endblock %}

{% block content %}
<!-- Aggiungiamo i CDN di FullCalendar qui dentro -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/it.js'></script>

<div x-data="{ filter: 'tutti' }" class="max-w-5xl mx-auto space-y-6">

    <!-- Header e Filtri -->
    <div class="bg-white rounded-xl shadow-md p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-calendar-check text-blue-500 mr-2"></i> Calendario Ingressi e Uscite</h2>
            <p class="text-sm text-gray-500 mt-1">Gestione programmata dei veicoli in officina.</p>
        </div>
        <div class="inline-flex bg-gray-100 rounded-lg p-1">
            <button @click="$dispatch('open-agenda-modal')" class="bg-purple-600 hover:bg-purple-700 shadow text-white px-4 py-2 rounded-md text-sm font-medium transition-colors"><i class="fas fa-plus mr-1"></i> Nuovo Impegno</button>
        </div>
    </div>

    <!-- Lista Appuntamenti -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <!-- Altezza minima per evitare che collassi -->
        <div id="calendar" class="p-4" style="min-height: 700px;"></div>
    </div>
</div>

    <!-- Modale Impegno Generico -->
    <div x-data="{ show: false, titolo: '', data_ora: '', tipo: 'Scadenza', note: '' }"
         @open-agenda-modal.window="show = true; titolo = ''; data_ora = ''; note = '';"
         @open-agenda-modal-date.window="show = true; titolo = ''; data_ora = $event.detail; note = '';"
         x-show="show"
         class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="show" class="fixed inset-0 transition-opacity" aria-hidden="true" @click="show = false">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="show" class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Nuovo Impegno Generico</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Titolo *</label>
                            <input type="text" x-model="titolo" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Data e Ora *</label>
                            <input type="datetime-local" x-model="data_ora" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipo</label>
                            <select x-model="tipo" class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                <option>Entrata</option>
                                <option>Scadenza</option>
                                <option>Attività</option>
                                <option>Richiamo</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Note</label>
                            <textarea x-model="note" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="
                        if(!titolo || !data_ora) { alert('Compila i campi obbligatori'); return; }
                        fetch('/api/agenda/nuovo', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({titolo: titolo, data_ora: data_ora, tipo_impegno: tipo, note: note})
                        }).then(r => r.json()).then(d => {
                            if(d.success) window.location.reload();
                            else alert('Errore');
                        })
                    " class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                        Salva
                    </button>
                    <button type="button" @click="show = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Annulla
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modale Dettaglio / Modifica Note -->
    <div x-data="{ show: false, id: null, veicolo_id: null, titolo: '', note: '' }"
         @open-event-modal.window="show = true; id = $event.detail.id; veicolo_id = $event.detail.veicolo_id; titolo = $event.detail.titolo; note = $event.detail.note || '';"
         x-show="show"
         class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="show" class="fixed inset-0 transition-opacity" aria-hidden="true" @click="show = false">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="show" class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" x-text="titolo"></h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Note</label>
                            <textarea x-model="note" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                        <template x-if="veicolo_id">
                            <div class="mt-4">
                                <a :href="'/veicolo/' + veicolo_id" class="text-blue-600 hover:text-blue-800 text-sm font-medium"><i class="fas fa-car mr-1"></i> Vai alla scheda veicolo</a>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="
                        fetch('/api/agenda/' + id + '/note', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({note: note, veicolo_id: veicolo_id})
                        }).then(r => r.json()).then(d => {
                            if(d.success) window.location.reload();
                            else alert('Errore');
                        })
                    " class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                        Salva Note
                    </button>
                    <button type="button" @click="show = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Chiudi
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'it',
            eventDisplay: 'block',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: '/api/agenda',
            dateClick: function(info) {
                var dt = info.dateStr;
                if(dt.length === 10) dt += "T09:00"; // Default time
                window.dispatchEvent(new CustomEvent('open-agenda-modal-date', { detail: dt }));
            },
            eventClick: function(info) {
                window.dispatchEvent(new CustomEvent('open-event-modal', {
                    detail: {
                        id: info.event.id,
                        veicolo_id: info.event.extendedProps.veicolo_id,
                        titolo: info.event.title,
                        note: info.event.extendedProps.note
                    }
                }));
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
