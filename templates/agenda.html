{% extends "base.html" %}

{% block header_title %}Agenda Officina{% endblock %}

{% block content %}
<!-- Aggiungiamo i CDN di FullCalendar qui dentro -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/it.js'></script>

<div x-data="{ filter: 'tutti' }" class="max-w-5xl mx-auto space-y-6">

    <!-- Header e Filtri -->
    <div class="bg-white rounded-xl shadow-md p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-calendar-check text-blue-500 mr-2"></i> Calendario Ingressi e Uscite</h2>
            <p class="text-sm text-gray-500 mt-1">Gestione programmata dei veicoli in officina.</p>
        </div>
    </div>

    <!-- Lista Appuntamenti -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <!-- Altezza minima per evitare che collassi -->
        <div id="calendar" class="p-4" style="min-height: 700px;"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'it',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: '/api/agenda',
            eventClick: function(info) {
                window.location.href = '/veicolo/' + info.event.extendedProps.veicolo_id;
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
