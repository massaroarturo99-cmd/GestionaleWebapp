{% extends "base.html" %}

{% block header_title %}Modifica Prodotto: {{ prodotto.nome }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h3 class="text-xl font-bold text-gray-800"><i class="fas fa-edit text-blue-500"></i> Modifica Prodotto dal Listino</h3>
        <a href="/fornitore/{{ fornitore.id }}" class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition-colors" title="Indietro"><i class="fas fa-arrow-left"></i> Torna</a>
    </div>

    <form method="POST" action="/prodotto/{{ prodotto.id }}/modifica">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Nome Prodotto *</label>
            <input required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 focus:ring-blue-500" name="nome" type="text" value="{{ prodotto.nome }}">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Prezzo Standard (€)</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 focus:ring-blue-500" name="prezzo_listino" type="number" step="0.01" inputmode="decimal" value="{{ "%.2f"|format(prodotto.prezzo_listino) }}">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow transition-colors">
            Salva Modifiche
        </button>
    </form>
</div>
{% endblock %}
